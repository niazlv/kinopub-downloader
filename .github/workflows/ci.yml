name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race matters here: the engine downloads several episodes concurrently,
      # the rate limiter and the 429 backoff are shared across workers, and the
      # progress reporter is written from every one of them.
      - name: go test
        run: go test -race -timeout 10m ./...

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest

    # The platform-specific files (credstore seeds, httpx dialers, termux/termx)
    # only compile on their own GOOS, so a build break on Android or Windows is
    # invisible until the release workflow runs. These are the targets release.yml
    # ships; keep the two lists in sync.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: android, goarch: arm64 }
          # android/arm links only externally, so it needs cgo and the NDK's
          # clang, which the runner image already carries. Same as release.yml.
          - { goos: android, goarch: arm, goarm: "7", cgo: "1", cc: armv7a-linux-androideabi21-clang }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          # Left at Go's cross-compile default (0), same as release.yml, except
          # for the one target that cannot link without it.
          CGO_ENABLED: ${{ matrix.cgo || '0' }}
          NDK_CC: ${{ matrix.cc }}
        run: |
          if [ -n "$NDK_CC" ]; then
            export CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$NDK_CC"
          fi
          go build ./...
